# Calevate — WAL archiving settings for PostgreSQL 16 on the VPS (D-26).
#
# Install as /etc/postgresql/16/main/conf.d/10-calevate-archiving.conf (Debian layout) or
# include it from postgresql.conf. A conf.d drop-in rather than edits in place, so a
# distribution package upgrade cannot quietly revert archiving.
#
# Changing archive_mode or wal_level REQUIRES A RESTART, not a reload. Everything else
# here is reloadable. Plan the restart; do not discover it.

# ---------------------------------------------------------------------------
# The archive itself
# ---------------------------------------------------------------------------

# Minimum for archiving and PITR. `replica` also leaves the door open to a streaming
# standby later without another restart.
wal_level = replica

archive_mode = on

# wal-g's documented archive_command is `wal-g wal-push %p` (wal-g docs/PostgreSQL.md).
# --config is added because archive_command runs in the postmaster's environment, where
# nothing was exported: without it wal-g finds no settings and every archive fails.
# Absolute path to the binary for the same reason — PATH is not what your shell has.
archive_command = '/usr/local/bin/wal-g --config /etc/wal-g/walg.json wal-push %p'

# THIS LINE IS WHAT MAKES RPO 15min TRUE, and it is the one people leave out.
# Without it, a partially filled 16MB segment is never archived. On a quiet night an SMB
# platform can take hours to fill one, so "continuous archiving" would in fact ship
# nothing between 23:00 and 07:00 and the last hours of work would be unrecoverable.
# archive_timeout forces a segment switch, so worst-case loss is bounded by this value
# plus upload time rather than by write volume.
#
# WHY 300 AND NOT 60: 5 minutes is a third of the 15-minute RPO, which leaves room for a
# retrying archiver to catch up before the promise breaks, while producing 288 forced
# segments a day instead of 1440. Forced segments are mostly zeroes and compress hard, but
# the ratio is UNMEASURED here — measure it in the first week (infra/backup/README.md §6)
# and lower this number if the cost is negligible, which is the likely outcome.
archive_timeout = 300

# ---------------------------------------------------------------------------
# Making the base backup honest
# ---------------------------------------------------------------------------

# Page checksums cannot be turned on with a config line — they are set at initdb, or added
# offline with `pg_checksums --enable` on a stopped cluster. This comment is here because
# `wal-g backup-push --verify` has nothing to verify without them, and a corruption
# detector that silently detects nothing is worse than none. Confirm with:
#     SHOW data_checksums;   -- must be `on`
# If it is `off`, that is a scheduled maintenance task, not a backup setting. See README §3.

# Segments are kept locally until archived regardless, but a small floor gives a standby
# or a slow archiver room to catch up without an immediate gap.
wal_keep_size = 1GB

# ---------------------------------------------------------------------------
# What this file does NOT do
# ---------------------------------------------------------------------------
# It does not create the bucket, the credential, or the wal-g config; it does not install
# the timers; and it does not prove a single byte is restorable. That last one is
# runbooks/backup-restore-drill.md, and nothing in this file is a substitute for it.
