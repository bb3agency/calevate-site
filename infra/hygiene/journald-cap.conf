# Installs to /etc/systemd/journald.conf.d/calevate-cap.conf (root:root, 0644), then
#   systemctl restart systemd-journald
#
# WHY A CAP AND NOT A DAILY VACUUM. The reference host ran `journalctl --vacuum-size=200M`
# from its daily cleanup (`docs/evidence/raghava-deploy-teardown.md` §6.4). That fixes
# yesterday's overflow, needs root, and does nothing at all between runs — a service that
# floods the journal at 20:00 still fills the volume by 06:00. `SystemMaxUse=` is the same
# intent expressed as a property journald enforces continuously, so the journal cannot
# exceed it in the first place. It also removes the only privileged step from the daily
# hygiene job, which is what lets that unit run as the unprivileged deploy account
# (`infra/privileged/README.md` §4).
#
# THE NUMBERS. journald's own default is 10% of the filesystem capped at 4G, which on a
# large-disk VPS is a lot of journal for a host with four services. 512M holds weeks of
# this platform's logs — the application's own logs go to Docker and to pm2, not here — and
# it is the same order as the 200M the reference vacuumed to, chosen higher because a
# journal is the thing an operator reads during an incident and the cheapest thing to have
# too much of. `SystemKeepFree` is journald's other bound and is left at its default: it is
# a floor on the FILESYSTEM, and overriding it here would be a second disk policy competing
# with `RECLAIM_REFUSE_FLOOR_GB` in `scripts/deploy/docker-reclaim.sh`.
#
# Nothing here has been applied to a host (infra/README.md).

[Journal]
Storage=persistent
SystemMaxUse=512M
SystemMaxFileSize=64M
