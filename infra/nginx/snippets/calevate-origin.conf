# Cloudflare origin trust — restore the real client IP. THE REFUSAL IS NOT HERE.
#
# THIS FILE USED TO DO BOTH, AND THE SECOND HALF DID NOT WORK. Each range was paired as
# `set_real_ip_from X; allow X;` on the argument that one list cannot drift from itself.
# The reasoning was sound and the mechanism was wrong: nginx's realip documentation says
# `set_real_ip_from` "changes the client address for all places where the client address
# is used, including the access module" (nginx trac #1418). realip runs before the access
# phase, so `allow`/`deny` was comparing Cloudflare's ranges against the VISITOR's address
# — which never matches — and the closing `deny all` refused every proxied request. It
# looked exactly like a working origin lock, because direct-to-IP was refused too.
#
# The decision now lives in `origin-trust.conf` at http scope, where `geo` can test
# `$realip_remote_addr` — the peer realip preserves — and that file argues it in full.
# This snippet keeps only the half that always worked.
#
# WHY real-ip MATTERS HERE MORE THAN USUAL. It is not cosmetic logging. Three separate
# controls read the client address: the rate zones in `rate-zones.conf.template`, the
# `audit_log` entries this platform is required to keep under DPDP, and — the one that
# is a security control rather than a nuisance — voice-runtime's SOURCE-IP ALLOWLIST,
# which is the ENTIRE authenticity check for an unsigned engine (hard rule 3, TRD §5;
# Bolna does not sign its webhooks, so there is no signature to fall back on). Without
# real-ip restoration every delivery appears to come from a Cloudflare address, the
# allowlist matches nothing, and every genuine webhook is rejected.
#
# ORDER IS LOAD-BEARING. `real_ip_recursive on` walks the chain right-to-left skipping
# trusted addresses, so a client that sets its own `CF-Connecting-IP` cannot win: the
# header is only honoured when the CONNECTION came from a listed address.
#
# The Cloudflare ranges below and the ones in `origin-trust.conf` are the same set and
# must be refreshed together; `tests/nginx_origin_trust_test.py` fails if they diverge,
# which is the guarantee the old paired-lines layout was reaching for.

# --- HOW TO REFRESH -------------------------------------------------------------
# Cloudflare's authoritative list is https://www.cloudflare.com/ips-v4 and /ips-v6, and
# it must be applied to BOTH this file and `origin-trust.conf.template` in the same
# change — `check_cloudflare_ip_age` reads a stamp from each, and
# `tests/nginx_origin_trust_test.py` fails if the two range lists diverge.
#
# CLOUDFLARE_IPS_UPDATED: 2026-06-29
# Source: cloudflare.com/ips. If a range here disagrees with that page, that page is right.
# --------------------------------------------------------------------------------

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# THE REFUSAL. `if` is safe here: a bare `return` in server context is the one use the
# "if is evil" guidance explicitly permits, and `allow` cannot take a variable.
#
# DEPLOYMENT §5: "origin locked to CF ranges so the raw IP serves nothing." This is that
# sentence, and it now means it — a direct-to-IP scan finds a 403 rather than a login
# page, and combined with Full (strict) there is no un-proxied path to the API at all.
if ($calevate_origin_denied) {
    return 403;
}
