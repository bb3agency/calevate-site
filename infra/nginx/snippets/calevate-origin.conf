# Cloudflare origin trust — restore the real client IP, and refuse everyone else.
#
# TWO JOBS, ONE LIST, ON PURPOSE. Both jobs are statements about the same set of
# addresses ("these are Cloudflare's edge"), and the failure mode of keeping two lists is
# that one gets refreshed and the other does not — at which point either the origin
# starts rejecting live Cloudflare edges, or it starts trusting a header from an address
# that is no longer Cloudflare's. Paired lines make that impossible to do by halves.
#
#   set_real_ip_from  — trust `CF-Connecting-IP` from this address (ngx_http_realip)
#   allow             — accept a connection from this address at all (ngx_http_access)
#
# WHY real-ip MATTERS HERE MORE THAN USUAL. It is not cosmetic logging. Three separate
# controls read the client address: the rate zones in `rate-zones.conf.template`, the
# `audit_log` entries this platform is required to keep under DPDP, and — the one that
# is a security control rather than a nuisance — voice-runtime's SOURCE-IP ALLOWLIST,
# which is the ENTIRE authenticity check for an unsigned engine (hard rule 3, TRD §5;
# Bolna does not sign its webhooks, so there is no signature to fall back on). Without
# real-ip restoration every delivery appears to come from a Cloudflare address, the
# allowlist matches nothing, and every genuine webhook is rejected. DEPLOYMENT §5.3 flags
# this as a gap in the config this repo inherited; this file is where it is closed.
#
# ORDER IS LOAD-BEARING. `real_ip_recursive on` walks the chain right-to-left skipping
# trusted addresses, so a client that sets its own `CF-Connecting-IP` cannot win: the
# header is only honoured when the CONNECTION came from a listed address.
#
# --- HOW TO REFRESH -------------------------------------------------------------
# Cloudflare's authoritative list is https://www.cloudflare.com/ips-v4 and /ips-v6.
# `scripts/vps-deploy.sh` FAILS the deploy when the date below is older than
# CLOUDFLARE_IPS_MAX_AGE_DAYS (180), because a stale allowlist here does not degrade —
# it either blocks real traffic or trusts an address Cloudflare has released.
#
# CLOUDFLARE_IPS_UPDATED: 2026-06-29
# Source: cloudflare.com/ips (via the published ranges, read Aug 2026). If a range here
# disagrees with cloudflare.com/ips, cloudflare.com/ips is right and this file is stale.
# --------------------------------------------------------------------------------

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

set_real_ip_from 173.245.48.0/20;
allow            173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
allow            103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
allow            103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
allow            103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
allow            141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
allow            108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
allow            190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
allow            188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
allow            197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
allow            198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
allow            162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
allow            104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
allow            104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
allow            172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
allow            131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
allow            2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
allow            2606:4700::/32;
set_real_ip_from 2803:f800::/32;
allow            2803:f800::/32;
set_real_ip_from 2405:b500::/32;
allow            2405:b500::/32;
set_real_ip_from 2405:8100::/32;
allow            2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
allow            2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
allow            2c0f:f248::/32;

# Localhost, so the deploy script's own health poll and any on-box curl are not answered
# with a 403 that looks like an outage. It is a loopback address: nothing outside the VPS
# can present it, and it is not `set_real_ip_from`, so a local request cannot spoof a
# client IP either.
allow 127.0.0.1;
allow ::1;

# Everything else. DEPLOYMENT §5: "origin locked to CF ranges so the raw IP serves
# nothing." This is that sentence. It also means a direct-to-IP scan finds a 403 rather
# than a login page, and — combined with Full (strict) — that there is no un-proxied path
# to the API at all.
deny all;
