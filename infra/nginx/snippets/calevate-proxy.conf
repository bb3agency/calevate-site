# Proxy headers, shared by every `location` that forwards upstream.
#
# THE FORWARDED CLIENT ADDRESS IS A SECURITY INPUT ON THIS PLATFORM, not a logging
# nicety. Bolna does not sign its webhooks (D-31, TRD §5), so voice-runtime's authenticity
# check is a SOURCE-IP ALLOWLIST and the address the app reads IS the control.
#
# What the app actually reads (`calevate_shared.client_address.client_ip`, which BOTH
# deployables now call — the api reads it for `audit_log.ip` and the limiter too): ONE
# header, `CF-Connecting-IP`, and only when the immediate peer is a trusted proxy CIDR
# (the Docker bridge, which is what nginx->container looks like). Absent or unparseable,
# the request is REFUSED outside APP_ENV=local. It no longer reads `X-Forwarded-For` at
# all: it used to fall back to that header's LEFTMOST entry, which is whatever the
# original caller typed (MDN, X-Forwarded-For: security uses "must only use IP addresses
# added by a trusted proxy"; RFC 7239 section 8.1 says the same of `Forwarded`).
#
# So two things below are load-bearing, and both are easy to break by tidying:
#  1. `CF-Connecting-IP` is now SET here, to `$remote_addr` - which `real_ip`
#     (calevate-origin.conf) has already restored to Cloudflare's stated client for any
#     connection from a CF range, and which is the peer's own address for anything else.
#     That makes this nginx the single trusted hop that writes the header the app trusts,
#     which is "count the hops you actually have" reduced to the one hop we actually have.
#     Passing it through untouched (what this file did before) was honest only for CF
#     traffic: the origin lock also allows 127.0.0.1 for deploy health polls, so any
#     on-box process could POST a forged `CF-Connecting-IP` at the hooks vhost and clear
#     the allowlist. Now the forgery is overwritten with the forger's own address.
#     Do NOT write `$http_cf_connecting_ip` here (that reinstates the pass-through), and
#     do NOT write `$realip_remote_addr` (that is the Cloudflare edge address, so every
#     genuine webhook would then fail the allowlist).
#  2. `$proxy_add_x_forwarded_for` stays, for logs and the browser realms. It APPENDS to
#     the inbound value, so its leftmost entry is caller-controlled: no security control
#     may read it, here or in any handler added later.
proxy_set_header Host              $host;
proxy_set_header CF-Connecting-IP  $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTP/1.1 to the upstream so keepalive in the `upstream` blocks actually applies;
# clearing Connection is what keeps the pool from being torn down every request.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Never buffer a response to disk on a box whose disk is also Postgres's.
proxy_max_temp_file_size 0;

# Defaults for the browser realms. The hooks server tightens these in its own block —
# an engine callback waiting 60s is a call already lost.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
