# Proxy headers, shared by every `location` that forwards upstream.
#
# THE FORWARDED CLIENT ADDRESS IS A SECURITY INPUT ON THIS PLATFORM, not a logging
# nicety. Bolna does not sign its webhooks (D-31, TRD §5), so voice-runtime's authenticity
# check is a SOURCE-IP ALLOWLIST and the address the app reads IS the control.
#
# What the app actually reads (apps/voice-runtime/engine_intake.py, `client_ip`): it
# believes a forwarded header only when the immediate peer is a trusted proxy CIDR — the
# Docker bridge, which is what nginx→container looks like — and then it prefers
# `CF-Connecting-IP`, falling back to the FIRST entry of `X-Forwarded-For`.
#
# So two things below are load-bearing, and both are easy to break by tidying:
#  1. `CF-Connecting-IP` is NOT set here and must NOT be cleared here. nginx forwards
#     unrecognised client headers untouched, Cloudflare sets it to the true client and
#     overwrites anything the client sent, and `real_ip` (calevate-origin.conf) consumes
#     the same header for `$remote_addr` without consuming it from the request. Adding a
#     `proxy_set_header CF-Connecting-IP ...` line here would put nginx's opinion in front
#     of Cloudflare's fact.
#  2. `$proxy_add_x_forwarded_for` appends to the inbound value, so the LEFTMOST entry is
#     whatever the caller wrote. The app's fallback reads that leftmost entry, which is
#     safe here only because the origin lock means the connection came from Cloudflare and
#     `CF-Connecting-IP` is therefore always present. It is a narrow margin; do not widen
#     it by relaxing the origin allowlist.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTP/1.1 to the upstream so keepalive in the `upstream` blocks actually applies;
# clearing Connection is what keeps the pool from being torn down every request.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Never buffer a response to disk on a box whose disk is also Postgres's.
proxy_max_temp_file_size 0;

# Defaults for the browser realms. The hooks server tightens these in its own block —
# an engine callback waiting 60s is a call already lost.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
