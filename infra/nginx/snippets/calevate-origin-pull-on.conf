# Cloudflare Authenticated Origin Pulls: ON — every TLS connection must present the client
# certificate Cloudflare sends for this zone (D-734).
#
# WHY. `calevate-origin.conf` refuses a peer outside Cloudflare's published ranges, which
# stops a direct-to-IP scan. It cannot stop a request that reaches this origin THROUGH
# Cloudflare from somebody else's zone pointed at our address: that arrives from a
# Cloudflare range and skips every rule our zone applies (WAF, rate limits, bot rules).
# Zone-level AOP closes that: Cloudflare presents a certificate only our zone holds, and
# nginx refuses the TLS handshake of anything else.
#
# ZONE-LEVEL, WITH OUR OWN CERTIFICATE. Cloudflare's global AOP certificate is shared by
# every Cloudflare account, so it would prove only "came through Cloudflare", which the IP
# check already does. Zone-level AOP uses a leaf certificate we upload to the zone, signed
# by a CA we create; this file trusts that CA alone
# (developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/
# zone-level/, read 11 Oct 2026).
#
# THE CA FILE IS INSTALLED BY THE OPERATOR at /etc/nginx/certs/calevate-origin-pull-ca.pem
# and is not in this repository: it is generated for this deployment, and only its holder
# should decide what it signs. A CA certificate is not secret, but its key is.
#
# ORDER, because the wrong order takes the whole site down: upload the leaf certificate
# and switch zone-level AOP ON in Cloudflare FIRST; deploy with CF_ORIGIN_PULL=optional and
# confirm proxied requests verify; then deploy with CF_ORIGIN_PULL=on. Port 80 is not
# affected, so the ACME http-01 challenge keeps working.
ssl_client_certificate /etc/nginx/certs/calevate-origin-pull-ca.pem;
ssl_verify_client on;
