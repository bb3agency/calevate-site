# Cloudflare Authenticated Origin Pulls: OPTIONAL — the verification phase (D-734).
#
# nginx asks for Cloudflare's client certificate and checks it when one is sent, but still
# serves a request that sends none. Use it after switching zone-level AOP on in Cloudflare
# and before `on`: every proxied request should now arrive with a verified certificate,
# which `$ssl_client_verify` shows as SUCCESS, and a direct-to-origin request still works.
# The CA is the one that signed the leaf certificate uploaded to Cloudflare; see `-on.conf`.
ssl_client_certificate /etc/nginx/certs/calevate-origin-pull-ca.pem;
ssl_verify_client optional;
