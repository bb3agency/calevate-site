# TLS parameters, shared by every Calevate server block.
#
# Installed at /etc/nginx/snippets/calevate-tls.conf and included from inside `server {}`.
# It is NOT in conf.d/ — Debian auto-includes conf.d into `http {}`, and a fragment of
# server-context directives loaded there is a config-test failure, which is the whole
# reason DEPLOYMENT §5 inherited the snippets/ convention.
#
# THE CLIENT HERE IS CLOUDFLARE, NOT A BROWSER. The zone is proxied (orange) and locked
# to Cloudflare ranges (calevate-origin.conf), so this handshake is Cloudflare→origin on
# Full (strict). That is why TLS 1.2 is still allowed and why the cipher list is not
# tuned for ancient clients: there are none. Browser-facing TLS policy is Cloudflare's
# edge setting, configured in the dashboard, and is a different control.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:CalevateTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling. Harmless with Cloudflare in front and correct if the zone is ever
# greyed for debugging, which is exactly when a missing staple would surprise someone.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;

# Request-header timeout. It lives here because this is the one fragment every port-443
# block includes, the default_server among them. nginx's default is 60s, and the origin
# lock (`calevate-origin.conf`) can only refuse a connection AFTER its headers are read,
# so a direct-to-IP client dribbling one header line at a time holds a worker connection
# for a minute each (slow HTTP; OWASP Denial of Service Cheat Sheet). A real request's
# headers are a few KB sent in one go, so 10s costs it nothing. SNI picks the server block
# before HTTP starts, so each vhost's copy is the one that applies; a client sending no SNI
# gets the default_server's. The body timeout stays at nginx's default: the lock refuses
# before any body is read.
client_header_timeout 10s;
