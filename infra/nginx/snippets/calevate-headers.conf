# Security response headers, shared by every Calevate server block.
#
# `always` on every one: without it nginx omits the header on error responses, so the
# 4xx/5xx pages — the ones most likely to reflect something — would be the only pages
# served without protection.
#
# NO Content-Security-Policy HERE, ON PURPOSE. A CSP for a Next.js app has to know about
# that app's script nonces and its third-party origins (Sentry), it differs
# between the admin and client realms, and a wrong one either breaks the dashboard or is
# so permissive it is theatre. It belongs in the app's own response headers where the
# nonce is generated, not in a shared edge fragment — stated here so its absence reads as
# a decision rather than an oversight.
add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "DENY" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Permissions-Policy. It was MISSING ENTIRELY — the word did not appear anywhere in this
# repository — so every powerful browser feature was available to this origin by its own
# default, and to any frame this origin embeds. Nothing here uses one: `getUserMedia`,
# `navigator.geolocation`, WebUSB, Web Serial, Web Bluetooth, WebMIDI and the sensor APIs
# appear in NO file under `apps/web/src` (grepped 7 Sep 2026). The voice product runs on
# the telephone network, not in the tab, so the microphone in particular is a feature this
# console has no use for and an XSS foothold would.
#
# `feature=()` is the empty allowlist: denied to every origin INCLUDING this one, which is
# what makes it a control rather than a preference.
# (EVIDENCE CLASS: REPORTED, corroborated across independent secondaries on 7 Sep 2026 —
# https://noc.org/learn/permissions-policy and https://http.dev/permissions-policy.
# MDN and the W3C spec are both egress-blocked from this container, so this is NOT a
# primary reading; the SYNTAX is what was checked, and the feature list below is derived
# from this tree rather than from either page.)
#
# THREE FEATURES ARE DELIBERATELY NOT LISTED, and each absence is a decision:
#   - `payment`  — Razorpay Checkout renders a CROSS-ORIGIN iframe on the top-up screen.
#                  Whether it delegates the Payment Request API to that frame has not been
#                  verified from here (`razorpay.com` is egress-blocked; the same gap
#                  `lib/security/csp.ts` records for its subresources, OPERATIONS §2 gate
#                  44). `payment=()` would break a paying screen on a guess.
#   - `autoplay` — the call-recording player calls `play()`. A gesture-initiated play is
#                  not autoplay, but the interaction is not worth testing in production on
#                  a header whose benefit here is nil.
#   - `fullscreen` — defaults to `self` already; restating a default is noise that drifts.
add_header Permissions-Policy "accelerometer=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# HSTS. Two years, subdomains included, and deliberately WITHOUT `preload`: preloading is
# effectively irreversible and would commit every future *.calevate.tech name — including
# ones a client might CNAME — to HTTPS-only before anyone has decided that. Turning it on
# later is one word; turning it off is a browser-vendor form and months of cache.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Do not advertise the nginx patch level to a scanner.
server_tokens off;
