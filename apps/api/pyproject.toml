[project]
name = "calevate-api"
version = "0.1.0"
description = "FastAPI modular monolith — tenancy, agents, crm, billing, kb, compliance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "calevate-shared",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.44",
    "alembic>=1.16",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "uuid-utils>=0.10",
    "pyjwt[crypto]>=2.10",
    "redis>=5.3",
    "arq>=0.27",
    "email-validator>=2.2",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "argon2-cffi>=25.1",
    # PDF rendering for the engine's knowledgebase, which accepts a PDF file or a URL
    # and nothing else (`bolna-findings/mirror/pages/api-reference/knowledgebase/
    # create.md:36-51`). Pure Python, and chosen over reportlab because it embeds a
    # TrueType font with a correct `ToUnicode` CMap out of the box — which is what makes
    # Telugu EXTRACTABLE rather than merely visible (`kb/pdf_render.py`).
    #
    # Lockfile diff read before adding (hard rule 9): fpdf2 brings `fonttools` (font
    # subsetting), `pillow` (image support we do not use) and `defusedxml`. All three
    # are widely used, none declares a build hook or a postinstall step. `uharfbuzz`,
    # fpdf2's optional text-shaping extra, is deliberately NOT installed: shaping
    # corrupts the extracted text layer, measured in `kb/pdf_render.py`.
    "fpdf2>=2.8.8",
    # Multipart form parsing, for the ONE multipart route this API has: a client
    # uploading a knowledge document (`kb/routes.py`). Starlette imports it lazily and
    # raises at request time without it, so it is a declared dependency rather than an
    # extra — a missing parser would be a 500 on a route that looks mounted.
    #
    # THE FLOOR IS A SECURITY FLOOR, NOT A FEATURE ONE. CVE-2024-53981 (GHSA-pp6c-gr5w-3c5g,
    # "Denial of Service via deformed `multipart/form-data` boundary") is fixed in 0.0.18:
    # the parser skipped bytes before the first boundary and after the last ONE AT A TIME,
    # emitting a log event for each, so a body padded with junk stalls the event loop —
    # and on an ASGI app that is every tenant's request, not just the uploader's. Read
    # 4 Sep 2026 at github.com/Kludex/python-multipart/security/advisories/
    # GHSA-pp6c-gr5w-3c5g (evidence class VENDOR-PUBLISHED). 0.0.20 is the floor rather
    # than 0.0.18 so a resolver cannot pick the exact patch release and nothing since.
    #
    # Lockfile diff read before adding (hard rule 9): python-multipart resolves with NO
    # transitive dependencies of its own and declares no build or install hook; Apache-2.0;
    # latest release 0.0.32 (pypi.org/pypi/python-multipart/json, read 4 Sep 2026).
    "python-multipart>=0.0.20",
]

# Virtual member: run from the repo root as `apps.api.main:app`, never installed.
[tool.uv]
package = false
