[project]
name = "calevate-api"
version = "0.1.0"
description = "FastAPI modular monolith — tenancy, agents, crm, billing, kb, compliance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "calevate-shared",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.44",
    "alembic>=1.16",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "uuid-utils>=0.10",
    "pyjwt[crypto]>=2.10",
    "redis>=5.3",
    "arq>=0.27",
    "email-validator>=2.2",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "argon2-cffi>=25.1",
    # PDF rendering for the engine's knowledgebase, which accepts a PDF file or a URL
    # and nothing else (`bolna-findings/mirror/pages/api-reference/knowledgebase/
    # create.md:36-51`). Pure Python, and chosen over reportlab because it embeds a
    # TrueType font with a correct `ToUnicode` CMap out of the box — which is what makes
    # Telugu EXTRACTABLE rather than merely visible (`kb/pdf_render.py`).
    #
    # Lockfile diff read before adding (hard rule 9): fpdf2 brings `fonttools` (font
    # subsetting), `pillow` (image support we do not use) and `defusedxml`. All three
    # are widely used, none declares a build hook or a postinstall step. `uharfbuzz`,
    # fpdf2's optional text-shaping extra, is deliberately NOT installed: shaping
    # corrupts the extracted text layer, measured in `kb/pdf_render.py`.
    "fpdf2>=2.8.8",
]

# Virtual member: run from the repo root as `apps.api.main:app`, never installed.
[tool.uv]
package = false
