[project]
name = "calevate-workers"
version = "0.1.0"
description = "ARQ workers — post-call pipeline, embeddings, campaigns, retention"
requires-python = ">=3.12,<3.13"
dependencies = [
    "calevate-shared",
    "arq>=0.27",
    "sqlalchemy>=2.0.44",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    "httpx>=0.28",
    # RFC 7523's JWT-bearer assertion for Google service accounts (`google_oauth.py`,
    # used by the Sheets adapter and by Vertex AI). It was already imported here and
    # declared only by `apps/api` — the workspace installs one venv, so it resolved and
    # nothing went red, which is exactly how an undeclared dependency survives. `[crypto]`
    # is not optional for us: RS256 signing needs `cryptography`.
    #
    # DELIBERATELY NOT `google-auth`, which does the same job. See the argument in
    # `apps/workers/google_oauth.py`: it would be the second implementation of a flow this
    # repo already has, its refresh is synchronous and would need `requests` or `urllib3`
    # in an async worker, and PyJWT is already here. Its lockfile diff was read first —
    # two new pure-Python packages (`pyasn1`, `pyasn1-modules`), no install hooks — so the
    # decision is about duplication, not about supply-chain surface.
    "pyjwt[crypto]>=2.10",
    # Declared DIRECTLY, though `pyjwt[crypto]` above already pulls it in, because
    # `tls_expiry.py` imports `cryptography.x509` by name — and this file's own comment
    # two lines up is the argument: a package that resolves only because a sibling
    # declared it is an undeclared dependency that nothing goes red about. `>=42` is the
    # floor for `Certificate.not_valid_after_utc`; the naive `not_valid_after` it
    # replaced is deprecated and would compare an aware expiry against a local clock.
    # No lockfile change: this version is already installed transitively.
    "cryptography>=42",
    "boto3>=1.40",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

# Virtual member: run from the repo root as `apps.workers.settings.WorkerSettings`.
[tool.uv]
package = false
