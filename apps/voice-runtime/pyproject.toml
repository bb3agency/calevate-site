[project]
name = "calevate-voice-runtime"
version = "0.1.0"
description = "Engine webhooks + in-call tool endpoints. LATENCY-CRITICAL: ack < 500ms."
requires-python = ">=3.12,<3.13"
# Keep this dependency list deliberately small — every import here is paid for on
# the voice path (root CLAUDE.md hard rule 3: no heavy imports).
dependencies = [
    "calevate-shared",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "arq>=0.27",
    "sqlalchemy>=2.0.44",
    "psycopg[binary,pool]>=3.2",
]

[tool.uv]
package = false
