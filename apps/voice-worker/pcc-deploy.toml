# Pipecat Cloud deployment manifest for the Calevate voice worker (D-592, D-606, D-622).
#
# ⚠ THIS FILE HAS STILL NEVER BEEN APPLIED, but it is no longer written against guesses.
# Every key below is checked against the vendor's own schema — `pipecatcloud==1.2.0`,
# installed from PyPI and read 16 Sep 2026, `_utils/deploy_utils.py::load_deploy_config`,
# whose `expected_keys` set is the authoritative list and REJECTS anything outside it
# ("Unexpected keys in config file"). That is why a guessed key is worse than a missing
# one here: the CLI does not ignore it, it refuses the deploy.

# The deployed agent's name. Matches the workspace member and the image, so a log line,
# `pipecat cloud agent logs <name>` and this repository all say one word.
agent_name = "calevate-pipecat-worker"

# The secret set the platform injects into the container's environment. A deployed bot has
# none of the developer's `.env` (`pipecat/cli/agent_templates/AGENTS.md:302-304`), so this
# name is the whole of the runtime configuration story: `pipecat cloud secrets set
# calevate-pipecat-worker-secrets --file <file>` is what puts the values in, and
# `voice_worker/boot.py` is the list of what they must be. PLATFORM_KEK is NOT among them
# and never will be — see that module's docstring.
#
# ⚠ "DOES THE SECRET SET REACH THE CONTAINER AS PROCESS ENVIRONMENT?" WAS AN OPEN GATE AND
# IS NOW ANSWERED: yes. Three readings agree. (a) The secrets CLI parses its input as
# `KEY=VALUE` lines (`pipecatcloud/cli/commands/secrets.py:148,178`) and the vendor's own
# instruction is `--file .env`. (b) Their guide says a deployed bot "has none of your local
# .env, so without it it starts but every service call fails on missing keys"
# (`AGENTS.md:302-304`) — that is env-var behaviour described directly. (c) Their own
# scaffold reads deployment state with `os.environ.get("ENV")` to decide whether Krisp is
# available (`AGENTS.md:310`), which only works if the platform sets process environment.
secret_set = "calevate-pipecat-worker-secrets"

# No video on either leg: this is a phone call. `agent-2x` is the scaffold's choice when
# video input or output is enabled, and neither is.
agent_profile = "agent-1x"

# ⚠ REGION IS A MANIFEST KEY AFTER ALL, AND THIS FILE USED TO SAY IT WAS NOT. The claim
# came from reading the vendor's SCAFFOLD TEMPLATE (`pcc-deploy.toml.jinja2`), which emits
# no region — but a template is what the vendor chose to generate, not what the parser
# accepts. `load_deploy_config`'s `expected_keys` contains `region` and `architecture`
# (deploy_utils.py, read 16 Sep 2026). That is the difference between "the scaffold does
# not write it" and "the key does not exist", and the first was mistaken for the second.
#
# Mumbai, because the caller and the carrier are in India and the in-call path is the one
# place a hemisphere costs a turn (§8, box 1). `pipecat cloud organizations default-region`
# is set to the same value, so the two cannot disagree and neither is load-bearing alone.
region = "ap-south"

# CPU ARCHITECTURE, DECLARED RATHER THAN INHERITED. `pipecat cloud regions list` on the
# deploy host (16 Sep 2026) shows ap-south, eu-central, us-east and us-west all arm64 and
# nothing else — there is no amd64 region. The CLI validates this against the region's
# `supported_architectures` before deploying (`_utils/regions.py::
# validate_architecture_for_region`), so a mismatch is refused at the edge instead of
# becoming a container that never starts. It DESCRIBES the image; it does not convert one,
# which is why the Dockerfile's base digest is the arm64 one.
architecture = "arm64"

[scaling]
	# ONE WARM INSTANCE, WHICH IS A PILOT DECISION AND NOT THE PRODUCTION NUMBER.
	#
	# Zero would mean scale-to-zero, whose documented cold start is about 10 seconds
	# (`docs/evidence/engine-replacement-comet-2026-09-06.md:93`) — that is a business's
	# phone ringing for ten seconds before anything answers, which that same line calls
	# "not usable for inbound", and it is the failure a caller notices first.
	#
	# The production number is a capacity decision with a monthly rupee floor attached:
	# ten reserved instances at $0.0005/min each is about ₹19,008/month before a single
	# active minute (evidence:93, :104), against a product that charges ₹5.00/min and no
	# monthly fee (evidence:149). One instance carries one session (evidence:122), so
	# concurrency and this number are the same number. Nobody is being charged for a call
	# yet, so this is one — enough that the first real call does not wait on a cold start,
	# and not a standing bill for capacity no client is using. Raise it WITH the first
	# client, not before.
	min_agents = 1

[build]
	# WE DO NOT BUILD THIS IMAGE. PIPECAT DOES (D-622), and there is no `image` key above
	# for that reason rather than by omission.
	#
	# The deploy host is amd64 and every Pipecat Cloud region is arm64, so a local build
	# has to cross-compile — which this host cannot do at all (`/proc/sys/fs/binfmt_misc`
	# holds only `python3.12`; `docker run --platform linux/arm64 alpine uname -m` answers
	# `exec format error`, measured 16 Sep 2026). Installing QEMU on a production VPS to
	# emulate an entire image build, and then standing up a registry and an image-pull
	# secret so the platform can fetch the result, is a lot of moving parts to own for a
	# step the vendor performs on the correct architecture for free.
	#
	# With no `image` and no `build_id`, `pipecat cloud deploy --yes` uploads this context
	# and builds it (`cli/commands/deploy.py:909-945`, "No image specified, using Pipecat
	# Cloud Build"). Cloud builds use MANAGED credentials, so the `--credentials` image
	# pull secret that a pre-built image would require is skipped entirely (`:953-957`).
	# Builds are content-addressed and cached per region on a hash of this context
	# (`_cloud_build_flow`), so a redeploy that changes nothing re-uploads nothing.
	#
	# The context is the REPOSITORY ROOT, because the uv workspace lock spans every member
	# and the Dockerfile's COPY lines reach `packages/shared` and four sibling
	# `pyproject.toml` files. Run the deploy FROM the repository root with
	# `--config-file apps/voice-worker/pcc-deploy.toml`: `context_dir` is resolved against
	# the process's working directory, not against this file's location
	# (`_cloud_build_flow`: `Path(build_config.context_dir).resolve()`).
	context_dir = "."
	dockerfile = "apps/voice-worker/Dockerfile"
