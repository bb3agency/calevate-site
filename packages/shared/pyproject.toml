[project]
name = "calevate-shared"
version = "0.1.0"
description = "Shared Pydantic models, VoiceEngine protocol and normalized events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calevate_shared"]
