# Calevate CD — DEPLOYMENT §3.
#
# ============================ HOW THIS CANNOT FIRE BY ACCIDENT ======================
# A push to `production` IS the release (D-991, founder 15 Nov 2026). It deploys at once
# and does NOT wait for CI: CI runs on `main` and reports, but cannot hold a deploy back,
# so a commit should be green on `main` before it is pushed here. Three gates remain:
#
#   1. Repo VARIABLE `VPS_DEPLOY_ENABLED` must equal the string `true`. Unset or `false`,
#      every job here is skipped — the kill switch.
#   2. `github.ref` must be `refs/heads/production`, for a push and a dispatch alike. A
#      pull request never triggers this file, and a push to any other branch does not.
#   3. `environment: production`, so a required-reviewer rule can be attached in repo
#      settings without touching this file.
#
# NO CREDENTIALS ARE WIRED HERE, and none should be. The runner is INSTALLED ON THE VPS
# (label `calevate-vps`) and polls GitHub over outbound HTTPS — there is no inbound SSH,
# no deploy key, no `VPS_SSH_PRIVATE_KEY`. Application secrets live in `/var/www/calevate/.env`,
# placed by a human from the secrets manager (DEPLOYMENT §6). GitHub holds one path and
# some flags: paths in Secrets, booleans in Variables.
#
# ================== SUPPLY CHAIN: ZERO ACTIONS ON THE PRODUCTION HOST =================
# The jobs that run ON THE HOST (`web-env`, `deploy`) call no action at all. Only the
# `web-build` job uses actions, pinned to commits as CI's are, on a GitHub runner with no
# access to the host; what it produces is checked against this commit before it is used.
# The host jobs call no action — not even `actions/checkout`. They do not
# need one: the deploy target IS the runner's host and the checkout it deploys already
# lives at `VPS_CLIENT_PATH`. That is a deliberate choice, not an omission. Every action
# in a deploy workflow runs with the deploy job's permissions on the production host, and
# a compromised action there is a compromised production host (hard rule 9). The cost of
# avoiding it is two lines of `bash`; the cost of pinning-and-trusting is permanent.
#
# ============================ HOW A ROLLBACK IS REACHED =============================
# Actions -> Deploy -> "Run workflow", and put the previous good sha in `commit_sha`.
# That runs `scripts/vps-deploy.sh --checkout <sha>`, which fetches, moves the deploy
# checkout to exactly that commit (detached), reuses the image already tagged for it if it
# is still on the host, SKIPS the migration when the database is ahead of that artefact
# (hard rule 8 is what makes the older release able to serve the newer schema), and swaps.
# `.deploy-state/history` on the box is where the previous sha comes from.
#
# The checkout stays detached on purpose, so the next push deploy REFUSES rather than
# pulling back onto the tip and silently undoing the rollback. Roll forward with another
# dispatch, or `git -C $VPS_CLIENT_PATH checkout production` to resume automatic deploys.
# `tests/deploy_checkout_flag_test.py` drives both halves against a real git tree.
#
# ========================== WHY ONE JOB AND NOT THREE ===============================
# DEPLOYMENT §3 sketched three independent jobs so a docs-only change would not rebuild
# Docker. That property is kept — but it is enforced in `scripts/vps-deploy.sh`, which
# diffs the last deployed SHA against HEAD through an explicit path→component map and
# exits before building when nothing maps. Splitting it into three jobs would require
# three `paths:` filters here, i.e. a SECOND copy of that map, living in a different
# language, drifting the first time a directory moves. One map, one place.
#
# The hard-rule-3 property that matters — `api` changes never restart voice-runtime —
# comes from that same map plus `compose up -d --no-deps`, not from job separation.
# A single component can still be deployed alone: `workflow_dispatch` with
# `components: voice-runtime`, or the same argument to the script on the box.

name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "ROLLBACK: deploy this exact commit instead of the head of production (40 or 7+ hex chars). Empty = normal deploy."
        required: false
        type: string
        default: ""
      components:
        description: "Components to deploy (space separated: api voice-runtime workers workers-bulk web nginx; workers includes workers-bulk). Empty = whatever changed."
        required: false
        default: ""
      dry_run:
        description: "Resolve and print the plan without changing anything"
        type: boolean
        required: false
        default: false

# One deploy at a time, and NEVER cancel one in flight: a deploy interrupted between the
# migration and the container swap is the exact half-migrated state the script is written
# to avoid, and `cancel-in-progress` would create it on purpose.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ================= THE WEB IS BUILT ON GITHUB, NOT ON THE LIVE HOST ==================
  # `next build` on the VPS took 4-5 minutes at the lowest priority beside live traffic
  # (founder, 16 Nov 2026: "make the deploy 1 to 2 min"). It is built on a GitHub runner
  # instead, in parallel with nothing on the host, and the deploy job only unpacks it
  # (`vps-deploy.sh --web-build`). The build is for THIS commit and the script checks that;
  # any failure here leaves the deploy building the web on the host as before.
  #
  # `web-env` hands the build the browser tier's settings, which live in
  # apps/web/.env.local on the host only. They are NEXT_PUBLIC_* values, inlined into the
  # JavaScript every visitor downloads, so carrying them as a job output reveals nothing.
  # A file holding any other key is not passed on at all: the host builds instead.
  web-env:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      inputs.commit_sha == ''
    runs-on: [self-hosted, calevate-vps]
    timeout-minutes: 2
    outputs:
      public: ${{ steps.read.outputs.public }}
    env:
      VPS_CLIENT_PATH: ${{ secrets.VPS_CLIENT_PATH }}
    steps:
      - name: Read the browser tier's public settings
        id: read
        run: |
          set -euo pipefail
          file="${VPS_CLIENT_PATH:-/nonexistent}/apps/web/.env.local"
          if [[ ! -f "$file" ]]; then
            echo "::warning::$file is missing; the web will be built on the host."
            exit 0
          fi
          other=$(grep -Ev '^[[:space:]]*(#|$)' "$file" | grep -Ev '^NEXT_PUBLIC_[A-Z0-9_]+=' || true)
          if [[ -n "$other" ]]; then
            echo "::warning::apps/web/.env.local holds keys other than NEXT_PUBLIC_*; not passed to GitHub, the web will be built on the host."
            exit 0
          fi
          echo "public=$(grep -E '^NEXT_PUBLIC_[A-Z0-9_]+=' "$file" | base64 -w0)" >> "$GITHUB_OUTPUT"

  web-build:
    needs: web-env
    if: needs.web-env.outputs.public != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from `packageManager` in the root package.json, as in CI.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Build the web for this commit
        env:
          PUBLIC_ENV: ${{ needs.web-env.outputs.public }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          echo "$PUBLIC_ENV" | base64 -d > apps/web/.env.local
          export CALEVATE_DEPLOY_BUILD=1 CALEVATE_SKIP_BUILD_CHECKS=1 CALEVATE_DIST_DIR=.next-build
          export CALEVATE_BUILD_COMMIT="$BUILD_SHA"
          pnpm -C apps/web build
          rm -rf apps/web/.next-build/cache
          echo "$BUILD_SHA" > apps/web/.next-build/.calevate-commit
          tar -czf web-build.tgz -C apps/web/.next-build .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: web-build.tgz
          retention-days: 1

  deploy:
    # After the web build, whether it ran, failed or was skipped (not when the run is cancelled): without it the host builds
    # the web itself, so a GitHub outage never holds a release back.
    needs: web-build
    if: >-
      !cancelled() &&
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, calevate-vps]
    environment: production
    permissions:
      contents: read
      # To download this run's web build through the REST API.
      actions: read
    timeout-minutes: 45

    env:
      # A PATH, not a secret in the cryptographic sense — held as a Secret because it
      # names our directory layout on a live host, which is the raghava convention
      # (paths in Secrets, flags in Variables) and not worth breaking for one value.
      VPS_CLIENT_PATH: ${{ secrets.VPS_CLIENT_PATH }}
      # Opt-in, off by default: a CD run that silently rewrites the edge config of a live
      # site is not reviewable after the fact. With this unset the script renders the
      # config and prints the install commands instead of running them.
      NGINX_AUTO_RELOAD: ${{ vars.NGINX_AUTO_RELOAD }}
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      TLS_LIVE_DIR: ${{ vars.TLS_LIVE_DIR }}
      ORIGIN_CERT_PATH: ${{ vars.ORIGIN_CERT_PATH }}
      ORIGIN_KEY_PATH: ${{ vars.ORIGIN_KEY_PATH }}

    steps:
      - name: Verify required configuration
        # Fail with instructions, not with a `cd` error 40 lines into the deploy. Every
        # name below is a path or a flag; if a future step needs an application secret,
        # that is the signal that it belongs in `.env` on the host instead.
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${VPS_CLIENT_PATH:-}" ]]; then
            echo "::error::Secret VPS_CLIENT_PATH is not set (expected: /var/www/calevate)"
            missing=1
          elif [[ ! -x "$VPS_CLIENT_PATH/scripts/vps-deploy.sh" ]]; then
            echo "::error::$VPS_CLIENT_PATH/scripts/vps-deploy.sh is missing or not executable."
            echo "::error::Do the first deploy by hand (DEPLOYMENT §9 step 4) before enabling CD."
            missing=1
          fi
          if [[ ! -f "${VPS_CLIENT_PATH:-/nonexistent}/.env" ]]; then
            echo "::error::$VPS_CLIENT_PATH/.env is missing. Place it from the secrets manager;"
            echo "::error::no workflow writes it and none ever should (DEPLOYMENT §6)."
            missing=1
          fi
          # `sudo -n -l <path>` asks whether THIS command is granted without a prompt; a
          # prompting sudo under CD blocks until the job times out instead of failing.
          if ! sudo -n -l /usr/local/sbin/calevate-predeploy-backup >/dev/null 2>&1; then
            echo "::error::the runner's account may not run /usr/local/sbin/calevate-predeploy-backup"
            echo "::error::without a password. Install it and infra/privileged/sudoers.d/calevate-deploy"
            echo "::error::as DEPLOYMENT §3a step 0 shows."
            missing=1
          fi
          exit "$missing"

      - name: Back up the database
        # Before anything changes, as the pull path does (scripts/deploy/auto-deploy.sh): no
        # backup, no deploy. A dry run changes nothing, so it takes none.
        if: ${{ inputs.dry_run != true }}
        run: sudo -n /usr/local/sbin/calevate-predeploy-backup

      - name: Fetch the web build
        # Through the REST API rather than an action: this job runs on the production host,
        # where an action would run with the deploy's permissions (see the header). Any
        # failure leaves no file, and the deploy then builds the web on the host.
        if: ${{ needs.web-build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          dir="${RUNNER_TEMP:-/tmp}/web-build"
          rm -rf "$dir" && mkdir -p "$dir"
          api="https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts?name=web-build"
          listing=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" || true)
          pick='import json,sys; a=json.load(sys.stdin).get("artifacts", []); print(a[0]["archive_download_url"] if a else "")'
          url=$(printf '%s' "$listing" | python3 -c "$pick" 2>/dev/null || true)
          if [[ -z "$url" ]] || ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$dir/web-build.zip" "$url"; then
            echo "::warning::could not fetch the web build; the web will be built on the host."
            exit 0
          fi
          python3 -m zipfile -e "$dir/web-build.zip" "$dir" && rm -f "$dir/web-build.zip"

      - name: Deploy
        # TWO MODES, AND THEY ARE MUTUALLY EXCLUSIVE BY CONSTRUCTION.
        #
        # FORWARD (`--expected-sha`) is the anti-race gate: this run is for ONE pushed
        # commit, and `production` can move again before the job starts. The script
        # fast-forwards the checkout and then aborts rather than shipping a commit this run
        # was not started for; the next push's own run deploys that one.
        #
        # ROLLBACK (`--checkout`) is the whole reason `workflow_dispatch` takes a sha. It
        # is the only rollback anybody can reach without an SSH session, and it is what
        # makes the kill switch a last resort instead of the first move. `--expected-sha`
        # is deliberately NOT passed with it: the flag that CHOOSES the commit and the
        # flag that VERIFIES it would then be one value checking itself, which reads like
        # a gate and is not one.
        #
        # NOTE WHAT THIS STEP DOES NOT DO: no `git fetch`, no `git checkout`, no `docker`,
        # no `alembic`. Moving the deploy checkout is `--checkout`'s job inside the script,
        # for the same reason migrations are: a workflow that reimplements a step of
        # `vps-deploy.sh` is a second copy that drifts, and the copy that drifts is the one
        # nobody runs by hand. `scripts/check_deploy_workflow.py` fails CI if this step
        # grows one.
        #
        # `github.sha` is the pushed commit on a push and the tip of `production` on a
        # dispatch.
        env:
          DEPLOY_SHA: ${{ github.sha }}
          ROLLBACK_SHA: ${{ inputs.commit_sha }}
          COMPONENTS: ${{ inputs.components }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -n "${ROLLBACK_SHA:-}" ]]; then
            echo "::warning::Rollback requested: deploying $ROLLBACK_SHA instead of the head of production."
            echo "::warning::The checkout is left DETACHED, so the next automatic deploy REFUSES"
            echo "::warning::rather than pulling back onto the tip. To resume automatic deploys:"
            echo "::warning::  git -C \"$VPS_CLIENT_PATH\" checkout production"
            args=(--checkout "$ROLLBACK_SHA")
          else
            args=(--expected-sha "$DEPLOY_SHA")
          fi
          if [[ "${DRY_RUN:-false}" == "true" ]]; then args+=(--dry-run); fi
          # Unquoted on purpose: this input is a space-separated component list and the
          # script rejects any word that is not a known component name.
          # shellcheck disable=SC2206
          if [[ -n "${COMPONENTS:-}" ]]; then args+=(${COMPONENTS}); fi
          # Only to a script that knows the flag: the copy on the host is the one from the
          # last deploy until this run updates it, and an older copy would refuse it.
          web_build="${RUNNER_TEMP:-/tmp}/web-build/web-build.tgz"
          if [[ -f "$web_build" ]] && grep -q -- '--web-build)' "$VPS_CLIENT_PATH/scripts/vps-deploy.sh"; then
            args+=(--web-build "$web_build")
          fi
          "$VPS_CLIENT_PATH/scripts/vps-deploy.sh" "${args[@]}"

      - name: Deploy failed — what is running now
        if: failure()
        run: |
          echo "::error::Deploy failed. The script aborts at the failing step and does not"
          echo "::error::continue, so the previous release is still serving unless the"
          echo "::error::failure was in the swap step itself."
          echo "::error::Procedure: runbooks/deploy-failed.md (ordered by which step failed)."
          echo "::error::To roll back without SSH: re-run this workflow from the Actions tab"
          echo "::error::with commit_sha set to the previous good sha (see the header of this file)."
