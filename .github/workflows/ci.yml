# Calevate CI — the guardrail pack is the point (D-29).
#
# "Rules that matter are executable. A Hard Rule enforced only by memory or review will
# be violated exactly when the codebase grows fastest." This workflow is where that
# stops being a sentence in a doc.
#
# Order is deliberate: the cheap checks fail fast (lint, types), then the suite, then
# the guardrails — which need a MIGRATED database, because `check_rls_coverage` reads
# `pg_policies` rather than trusting the migration that claims to have created them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app role is NOSUPERUSER NOBYPASSRLS in every environment including CI —
  # verifying RLS as a superuser would verify nothing.
  DATABASE_URL: postgresql+psycopg://calevate_app:calevate_app@localhost:5432/calevate
  ALEMBIC_DATABASE_URL: postgresql+psycopg://calevate:calevate@localhost:5432/calevate
  REDIS_URL: redis://localhost:6379/0
  OBJECT_STORE_ENDPOINT: http://localhost:9000
  OBJECT_STORE_BUCKET: calevate-ci
  APP_ENV: local
  ENGINE: fake

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: calevate
          POSTGRES_PASSWORD: calevate
          POSTGRES_DB: calevate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calevate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Create the unprivileged app role
        # Migrations grant to this role, so it must exist before `alembic upgrade`.
        run: |
          PGPASSWORD=calevate psql -h localhost -U calevate -d calevate -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE calevate_app LOGIN PASSWORD 'calevate_app' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=calevate psql -h localhost -U calevate -d calevate -v ON_ERROR_STOP=1 -c \
            "GRANT ALL ON SCHEMA public TO calevate_app;"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Seed
        run: uv run python -m scripts.seed

      - name: Tests
        # Under `coverage run` so the ratchet below has something to score. ONE suite
        # run, not two: the gate costs the instrumentation overhead and nothing else
        # (measured, ENGINEERING-PRACTICES §2). `branch = true` lives in pyproject.
        #
        # `-p scripts.check_coverage_ratchet` loads the gate's own plugin, which records
        # what this run consisted of (outcomes, deselection, whether Postgres and Redis
        # answered, and whether either already held data before the first test) into
        # `.coverage-run.json`. The ratchet step below scores nothing without it — which
        # is deliberate: this job is where "empty stores" is guaranteed rather than
        # remembered (a migrated+seeded database and a service container Redis that has
        # never served a suite), and the manifest is how the next step knows it.
        run: uv run coverage run -m pytest -q -p scripts.check_coverage_ratchet

      - name: "Guardrail: coverage ratchet (D-29 coverage:ratchet)"
        # Uncovered units per HARD-RULE SURFACE, each with a budget that only goes down.
        # Reads the `.coverage` the step above wrote, plus the manifest beside it. Exit 1
        # = a verdict (cover the branch or argue the budget); exit 2 = REFUSED, the run
        # was partial, failing, unserviced, or started against stores that were not empty.
        # No `continue-on-error` on either: a refusal is not a pass, and a step that
        # cannot judge must not be the step that lets a merge through.
        run: uv run python -m scripts.check_coverage_ratchet

      # --- The guardrail pack (D-29 §2). A red guardrail blocks merge. -----------
      - name: "Guardrail: engine isolation (hard rule 2)"
        run: uv run lint-imports

      - name: "Guardrail: RLS coverage (hard rule 1)"
        run: uv run python -m scripts.check_rls_coverage

      - name: "Guardrail: ledger immutability (hard rule 4)"
        run: uv run python -m scripts.check_ledger_immutability

      - name: "Guardrail: bootstrap keys stay environment-only (D-95 §4)"
        run: uv run python -m scripts.check_bootstrap_keys

      - name: "Guardrail: redaction exposure (hard rule 5)"
        run: uv run python -m scripts.check_redaction_exposure

      - name: "Guardrail: compliance invariants (hard rule 5)"
        # Every dial path passes the gate and OBEYS it, no bypass exists, and the schema
        # still carries the invariants the code assumes. Runs after `Migrate` because its
        # last section reads pg_catalog rather than trusting the migration.
        run: uv run python -m scripts.check_compliance_invariants

      - name: "Guardrail: nothing half-wired (CLAUDE.md)"
        # Was in `make guardrails` and in no CI step — the local gate ran it and the gate
        # that blocks merge did not. `tests/guardrail_audit_test.py` now globs
        # `scripts/check_*.py` and requires every one of them in BOTH files, so the two
        # lists cannot drift apart again.
        run: uv run python -m scripts.check_wiring

      - name: "Guardrail: docs drift (D-29 check:docs-drift)"
        # Commands the docs name resolve, `D-xx` references resolve, and SEC-COMP §3
        # still cites rule strings the code emits. No database needed.
        run: uv run python -m scripts.check_docs_drift

      - name: "Guardrail: env parity (fail-fast config)"
        run: uv run python -m scripts.check_env_parity

      - name: "Guardrail: web env parity (browser config)"
        # The other tier's half of the same rule. `next build` inlines NEXT_PUBLIC_*, so a
        # key that is undeclared, misspelled or secret-shaped ships as an empty string
        # instead of failing — this is where that becomes a failed build. Runs in THIS job
        # rather than the frontend one: it is a Python guardrail and needs no Node.
        run: uv run python -m scripts.check_web_env_parity

      - name: "Guardrail: OpenAPI snapshot freshness"
        run: uv run python -m scripts.check_openapi_fresh

      - name: "Quality gate: regression suite (ratchet)"
        # Exits non-zero only on a REGRESSION against the committed per-model baseline,
        # not on absolute failure — see scripts/eval.py.
        run: uv run python -m scripts.eval --client=ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -C apps/web typecheck
      - name: Lint
        run: pnpm -C apps/web lint
      # The frontend's behavioural gate. `tsc` and `next build` both pass on a screen
      # that renders a lapsed consent as messageable or a null cost as ₹0 — the
      # suite is the only check that can see the difference (D-29's argument, applied
      # to the half of the repo that had no executable rules at all).
      - name: Tests
        run: pnpm -C apps/web test
      - name: Build
        run: pnpm -C apps/web build

  types:
    # mypy runs on its own so a type error does not hide behind a failing test, and so
    # its cache is not invalidated by the database job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: mypy (strict)
        run: uv run mypy apps packages
