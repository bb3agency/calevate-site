# Calevate CI — the guardrail pack is the point (D-29).
#
# "Rules that matter are executable. A Hard Rule enforced only by memory or review will
# be violated exactly when the codebase grows fastest." This workflow is where that
# stops being a sentence in a doc.
#
# Order is deliberate: the cheap checks fail fast (lint, types), then the suite, then
# the guardrails — which need a MIGRATED database, because `check_rls_coverage` reads
# `pg_policies` rather than trusting the migration that claims to have created them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app role is NOSUPERUSER NOBYPASSRLS in every environment including CI —
  # verifying RLS as a superuser would verify nothing.
  DATABASE_URL: postgresql+psycopg://calevate_app:calevate_app@localhost:5432/calevate
  ALEMBIC_DATABASE_URL: postgresql+psycopg://calevate:calevate@localhost:5432/calevate
  REDIS_URL: redis://localhost:6379/0
  OBJECT_STORE_ENDPOINT: http://localhost:9000
  OBJECT_STORE_BUCKET: calevate-ci
  APP_ENV: local
  ENGINE: fake

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: calevate
          POSTGRES_PASSWORD: calevate
          POSTGRES_DB: calevate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calevate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Start MinIO
        # NOT a `services:` entry, and it cannot be one: MinIO needs `server /data` and
        # GitHub Actions service containers accept no `command`. `docker run` in a step is
        # the documented way round that, and the runner already has a daemon.
        #
        # WHY IT IS HERE AT ALL (D-106). `tests/object_lifecycle_test.py`'s three
        # store-backed checks guard the lifecycle policy that deletes recording AUDIO —
        # the only retention mechanism that touches bytes rather than pointers. Their
        # skipif is "is localhost:9000 reachable", and with no MinIO in CI the answer was
        # always no, so they had never executed ANYWHERE. When one finally ran on a
        # developer machine it failed immediately, and the failure was real.
        #
        # Credentials match `docker-compose.yml` so local and CI are the same shape; they
        # are the emulator's root user, not a secret.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=calevate -e MINIO_ROOT_PASSWORD=calevate123 \
            minio/minio server /data
          # Poll rather than sleep: the image is pulled here, so a fixed wait is either
          # wrong on a cold cache or wasted on a warm one. A failure to come up must fail
          # the job — a silent timeout would put the skip back, which is the whole defect.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy; object-lifecycle checks would silently skip"
          docker logs minio || true
          exit 1

      - name: Create the unprivileged app role
        # Migrations grant to this role, so it must exist before `alembic upgrade`.
        run: |
          PGPASSWORD=calevate psql -h localhost -U calevate -d calevate -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE calevate_app LOGIN PASSWORD 'calevate_app' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=calevate psql -h localhost -U calevate -d calevate -v ON_ERROR_STOP=1 -c \
            "GRANT ALL ON SCHEMA public TO calevate_app;"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Seed
        run: uv run python -m scripts.seed

      - name: Tests
        # Under `coverage run` so the ratchet below has something to score. ONE suite
        # run, not two: the gate costs the instrumentation overhead and nothing else
        # (measured, ENGINEERING-PRACTICES §2). `branch = true` lives in pyproject.
        #
        # `-p scripts.check_coverage_ratchet` loads the gate's own plugin, which records
        # what this run consisted of (outcomes, deselection, whether Postgres and Redis
        # answered, and whether either already held data before the first test) into
        # `.coverage-run.json`. The ratchet step below scores nothing without it — which
        # is deliberate: this job is where "empty stores" is guaranteed rather than
        # remembered (a migrated+seeded database and a service container Redis that has
        # never served a suite), and the manifest is how the next step knows it.
        #
        # A FAILING SUITE NO LONGER SKIPS THE GUARDRAILS. Every guardrail below is a
        # later step in this job, so one broken test used to mark all twelve `skipped` —
        # the run where something broke was the one run that never asked whether RLS
        # coverage had regressed, whether a ledger had lost its trigger, or whether a
        # secret had become loggable. CI was red for nine consecutive commits that way.
        #
        # The fix is `if: ${{ !cancelled() }}` on each guardrail, NOT
        # `continue-on-error` here: this step must still fail the job by itself, and
        # `tests/coverage_ratchet_guard_test.py` bans that key outright — correctly,
        # because "we re-raise it in a later step" is exactly the argument someone would
        # make while quietly making the gate ignorable.
        run: uv run coverage run -m pytest -q -p scripts.check_coverage_ratchet

      - name: "Guardrail: coverage ratchet (D-29 coverage:ratchet)"
        if: ${{ !cancelled() }}
        # Uncovered units per HARD-RULE SURFACE, each with a budget that only goes down.
        # Reads the `.coverage` the step above wrote, plus the manifest beside it. Exit 1
        # = a verdict (cover the branch or argue the budget); exit 2 = REFUSED, the run
        # was partial, failing, unserviced, or started against stores that were not empty.
        # No `continue-on-error` on either: a refusal is not a pass, and a step that
        # cannot judge must not be the step that lets a merge through.
        run: uv run python -m scripts.check_coverage_ratchet

      # --- The guardrail pack (D-29 §2). A red guardrail blocks merge. -----------
      - name: "Guardrail: engine isolation (hard rule 2)"
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      - name: "Guardrail: RLS coverage (hard rule 1)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_rls_coverage

      - name: "Guardrail: ledger immutability (hard rule 4)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_ledger_immutability

      - name: "Guardrail: models and schema agree about columns (P4.3)"
        if: ${{ !cancelled() }}
        # `alembic/env.py` generates the next migration against `Base.metadata`, so a
        # column that exists only in the database is a proposed DROP. Runs after
        # `Migrate` because it compares the models against the real schema, not a file.
        run: uv run python -m scripts.check_metadata_columns

      - name: "Guardrail: bootstrap keys stay environment-only (D-95 §4)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_bootstrap_keys

      - name: "Guardrail: config applies + bounds (D-101)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_config_applies

      - name: "Guardrail: observability readiness ladder (D-169)"
        if: ${{ !cancelled() }}
        # Disabled skips, enabled-but-misconfigured FAILS naming the setting. Catches the
        # state nothing else could see: a component this deployment believes is reporting
        # and is not. Also holds the two export filters hard rule 6 rests on
        # (`before_send`/`before_breadcrumb` on the error path, `_RedactingSpanExporter`
        # on the trace path) and the D-49 decision that Langfuse is not wired.
        # NO NETWORK: reachability is OPERATIONS §2 gate 15, against real hosts.
        run: uv run python -m scripts.check_observability_ready

      - name: "Guardrail: restore-drill evidence has not expired (D-166)"
        if: ${{ !cancelled() }}
        # Reads the newest quarterly record in docs/evidence/. NOT RUN today — no drill
        # record exists and OPERATIONS §8's "backups verified" is untick — and the step
        # prints that on every build rather than passing quietly. The check is
        # structurally incapable of producing the evidence it reads, which is the whole
        # of D-166: this step can never be preceded by one that manufactures a pass.
        run: uv run python -m scripts.check_drill_freshness

      - name: "Guardrail: redaction exposure (hard rule 5)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_redaction_exposure

      - name: "Guardrail: compliance invariants (hard rule 5)"
        if: ${{ !cancelled() }}
        # Every dial path passes the gate and OBEYS it, no bypass exists, and the schema
        # still carries the invariants the code assumes. Runs after `Migrate` because its
        # last section reads pg_catalog rather than trusting the migration.
        run: uv run python -m scripts.check_compliance_invariants

      - name: "Guardrail: nothing half-wired (CLAUDE.md)"
        if: ${{ !cancelled() }}
        # Was in `make guardrails` and in no CI step — the local gate ran it and the gate
        # that blocks merge did not. `tests/guardrail_audit_test.py` now globs
        # `scripts/check_*.py` and requires every one of them in BOTH files, so the two
        # lists cannot drift apart again.
        run: uv run python -m scripts.check_wiring

      - name: "Guardrail: docs drift (D-29 check:docs-drift)"
        if: ${{ !cancelled() }}
        # Commands the docs name resolve, `D-xx` references resolve, and SEC-COMP §3
        # still cites rule strings the code emits. No database needed.
        run: uv run python -m scripts.check_docs_drift

      - name: "Guardrail: model residency (D-127 asia-south1 only)"
        if: ${{ !cancelled() }}
        # No model traffic may reach a global Google endpoint, and the region may not be
        # settable from the ops console — a residency posture an operator can change from
        # a web form is one a click can invert. Decidable from syntax, so no database and
        # no network. Landed in the same change as the guardrail rather than after it:
        # the step above records what happens when the two lists drift, and this is the
        # one guardrail whose whole value is that it blocks a merge.
        run: uv run python -m scripts.check_model_residency

      - name: "Guardrail: audit rows record the caller, not the proxy"
        if: ${{ !cancelled() }}
        # SEC-COMP §5 wants "actor, tenant, at, ip". Eighty handlers read
        # `request.client` inline, which behind the edge is nginx — the column was
        # honest-looking and wrong on every audited route (D-131 fixed the definition,
        # D-139 the callers). Blocks the merge that reintroduces one.
        run: uv run python -m scripts.check_audit_ip

      - name: "Guardrail: an idempotency scope names a principal, not an address"
        if: ${{ !cancelled() }}
        # A reference platform with our exact idempotency design fell back to the client
        # address for an unauthenticated caller; behind a proxy that is one shared scope
        # for the whole internet, and the payoff is caller A being served caller B's
        # stored response. We do not have it — this blocks the merge that introduces it,
        # here and in the inbox/outbox replay keys (D-175).
        run: uv run python -m scripts.check_idempotency_scope

      - name: "Guardrail: env parity (fail-fast config)"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_env_parity

      - name: "Guardrail: deploy env preflight (the VALUES, not the key names)"
        if: ${{ !cancelled() }}
        # The gate `scripts/vps-deploy.sh` runs inside the new image before migrations
        # (D-168), pointed at the environment CI itself declares. Most of its refusals are
        # scoped to APP_ENV != local and are therefore inert here — that is honest rather
        # than hidden: the substance is `tests/deploy_env_preflight_test.py`, which builds
        # a bad `.env` per refusal and asserts on the named reason. What THIS step buys is
        # that the entry point still imports and still exits 0 on a coherent environment,
        # so a deploy is never the place a broken preflight is discovered.
        run: uv run python -m scripts.check_deploy_env

      - name: "Guardrail: web env parity (browser config)"
        if: ${{ !cancelled() }}
        # The other tier's half of the same rule. `next build` inlines NEXT_PUBLIC_*, so a
        # key that is undeclared, misspelled or secret-shaped ships as an empty string
        # instead of failing — this is where that becomes a failed build. Runs in THIS job
        # rather than the frontend one: it is a Python guardrail and needs no Node.
        run: uv run python -m scripts.check_web_env_parity

      - name: "Guardrail: raw SQL is built from our own source (D-172)"
        if: ${{ !cancelled() }}
        # Most tenant-scoped access here is hand-written SQL executed as a NOBYPASSRLS
        # role, so an injection is a cross-tenant breach rather than one account's leak.
        # Where a SQL fragment is passed in by callers, the check follows it to the call
        # sites — that half is why `plan_in_effect_sql`'s "no caller does" is now enforced.
        run: uv run python -m scripts.check_raw_sql

      - name: "Guardrail: OpenAPI snapshot freshness"
        if: ${{ !cancelled() }}
        run: uv run python -m scripts.check_openapi_fresh

      - name: "Guardrail: the unauthenticated surface is enumerated (D-173)"
        if: ${{ !cancelled() }}
        # `assert_policy_registry_complete` skips everything under a PUBLIC_PREFIXES
        # entry, which makes a prefix default-OPEN for every route added under it later.
        # This enumerates the exempt set instead and checks each row's claimed credential
        # against the module that serves it.
        run: uv run python -m scripts.check_public_routes

      - name: "Quality gate: regression suite (ratchet)"
        if: ${{ !cancelled() }}
        # Exits non-zero only on a REGRESSION against the committed per-model baseline,
        # not on absolute failure — see scripts/eval.py.
        run: uv run python -m scripts.eval --client=ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -C apps/web typecheck
      - name: Lint
        run: pnpm -C apps/web lint
      # The frontend's behavioural gate. `tsc` and `next build` both pass on a screen
      # that renders a lapsed consent as messageable or a null cost as ₹0 — the
      # suite is the only check that can see the difference (D-29's argument, applied
      # to the half of the repo that had no executable rules at all).
      - name: Tests
        run: pnpm -C apps/web test
      - name: Build
        run: pnpm -C apps/web build

  types:
    # mypy runs on its own so a type error does not hide behind a failing test, and so
    # its cache is not invalidated by the database job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: mypy (strict)
        run: uv run mypy apps packages

  deploy-artefacts:
    # THE FILES THAT PUT THIS SYSTEM IN PRODUCTION HAD NO CI STEP OF ANY KIND.
    #
    # `scripts/vps-deploy.sh` (700+ lines), `compose.prod.yml`, the dev compose file and
    # every script under `scripts/backup/` were checked by nothing: not `bash -n`, not
    # shellcheck, not `docker compose config`. A repository with thirteen executable
    # guardrails had zero on the artefact that ships it — which is how a preflight check
    # guarded by an unset array shipped and never ran, and why the register that found
    # that put "the deploy artefacts have no CI gate" in the same class as the terraform
    # nobody has ever applied.
    #
    # Deliberately small and daemon-free, so it stays fast and cannot flake: it answers
    # "would bash refuse to parse this?" and "would compose refuse to read this?", which
    # are exactly the failures that currently surface for the first time on the
    # production host. The BEHAVIOUR of the script is pytest's job
    # (`tests/deploy_rollback_test.py`, `tests/nginx_hooks_vhost_test.py`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every shell script parses
        # `bash -n` is a parse, not a run — nothing here executes a deploy.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d shell script(s)\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do bash -n "$script"; done

      - name: shellcheck
        # `-S warning`: the tree is clean at that severity today, and the two remaining
        # `info` hits are deliberate single-quoted strings that must NOT expand (an
        # `envsubst` variable list, and a `jq` filter). Gating on `info` would mean
        # decorating correct lines with disable comments to keep a check quiet, which is
        # how a check starts being edited around instead of read.
        run: shellcheck -S warning $(git ls-files '*.sh')

      - name: Both compose files are valid and address different projects
        # `config` is client-side: it interpolates, merges and validates without a
        # daemon. The empty `.env` stands in for the one a human places from the secrets
        # manager — `compose.prod.yml` declares `env_file: [.env]`, so without a file
        # there is nothing to interpolate against and this would fail for a reason that
        # is not a defect.
        #
        # The project-name assertion is the other half of a real incident shape: the
        # deploy directory on the VPS is `/var/www/calevate`, so a dev file with no
        # `name:` defaulted to the SAME compose project as production, and a bare
        # `docker compose up -d` there recreated production redis from the dev
        # definition. `scripts/vps-deploy.sh` refuses that at preflight; this refuses it
        # at review time.
        run: |
          set -euo pipefail
          [[ -f .env ]] || : > .env
          docker compose -f compose.prod.yml config -q
          docker compose -f docker-compose.yml config -q
          prod=$(docker compose -f compose.prod.yml config --format json | jq -r '.name')
          dev=$(docker compose -f docker-compose.yml config --format json | jq -r '.name')
          printf 'prod project: %s\ndev project:  %s\n' "$prod" "$dev"
          if [[ "$prod" == "$dev" ]]; then
            echo "::error::both compose files declare the project '$prod'. Both define a"
            echo "::error::'redis' service and only the prod one persists it, so a bare"
            echo "::error::'docker compose up -d' in the deploy directory would recreate"
            echo "::error::production redis from the dev definition."
            exit 1
          fi
