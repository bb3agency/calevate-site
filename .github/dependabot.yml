# Dependabot — the update mechanism that makes SHA-pinning safe to live with.
#
# `.github/workflows/ci.yml` pins every third-party action to a full commit SHA (hard
# rule 9). Pinning WITHOUT an updater is its own anti-pattern: the pin then silently ages
# past security patches. This config is the other half — it watches the upstream actions
# and raises a REVIEWABLE pull request when one moves, rewriting both the SHA and the
# `# vX.Y.Z` comment together so the two never drift.
#
# SCOPE IS `github-actions` AND the server image's `docker` base (below). The application
# dependency trees (pnpm/`apps/web`, uv/`pyproject`)
# are governed elsewhere — `pnpm-workspace.yaml` already pins CVE overrides by hand and
# carries a release-age quarantine — and adding their ecosystems here is a dependency-
# policy decision for the maintainer, not a CI-hardening default. Turn them on by adding
# `npm` (directory `/apps/web`) and `uv` (directory `/`) blocks when that call is made.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR for routine action bumps keeps the noise off six concurrent lanes;
    # a security-relevant advisory still opens its own PR regardless of grouping.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # The server image's base is pinned by digest (Dockerfile, hard rule 9). Without this
  # block the pin would age past Debian and CPython security fixes.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    # The project runs on Python 3.12 only (`pyproject.toml` requires-python ">=3.12,<3.13",
    # `uv.lock` "==3.12.*"), so a newer minor in the base image cannot install the lockfile.
    # Patch releases and digest refreshes of 3.12 still arrive; moving to a new Python is a
    # deliberate change to pyproject, the lockfile and this image together.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # compose.prod.yml pins Redis by digest for the same reason; this is what keeps that pin
  # from aging past Redis security releases ("docker-compose" ecosystem, GA 25 Feb 2025:
  # github.blog/changelog/2025-02-25-dependabot-version-updates-now-support-docker-compose-in-general-availability).
  # Minor and major moves stay deliberate: the queue's persistence format rides on them.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "redis"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
