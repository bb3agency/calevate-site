services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: calevate
      POSTGRES_PASSWORD: calevate
      POSTGRES_DB: calevate
    # Host port 5433: 5432 is occupied by another project on this machine.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calevate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host port 6380: 6379 is occupied by another project on this machine.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for R2 / DO Spaces. Recordings are the system of record, so
  # local work still goes through an S3 API rather than the filesystem.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: calevate
      MINIO_ROOT_PASSWORD: calevate123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
