# Local development infra ONLY — `make up`. Production is `compose.prod.yml`, which is
# driven exclusively by `scripts/vps-deploy.sh`.
#
# WHY THIS FILE DECLARES A PROJECT NAME. Compose defaults the project name to the
# directory basename. The deploy root on the VPS is `/var/www/calevate`, so this file's
# default there was `calevate` — the exact name `compose.prod.yml` declares. Both files
# then addressed ONE compose project, and both define a service called `redis`: a bare
# `docker compose up -d` in the deploy directory (this file is the default one) would
# recreate PRODUCTION redis from the definition below — no `--appendonly yes`, no
# `redis-data` volume — destroying the ARQ queue and the webhook dedupe keys, and would
# additionally publish Postgres on 0.0.0.0:5433 and MinIO on 0.0.0.0:9000 with the
# passwords written a few lines down. `docker compose down -v` would have taken the
# production project's volumes with it.
#
# Docker's published ports are inserted in nat/FORWARD and are NOT filtered by ufw's
# INPUT rules, so DEPLOYMENT §2's "inbound 22/80/443 only" would not have contained any
# of that. A distinct project name is the whole fix, and `preflight()` in
# `scripts/vps-deploy.sh` refuses to deploy from a checkout where this line has gone
# missing again.
#
# ONE-TIME COST, SAID OUT LOUD: on a machine that ran `make up` before this line existed,
# the old containers and volumes are still there under the OLD project name (the
# directory basename) and this file no longer sees them. Local Postgres will look empty.
# `make db-reset` reseeds; `docker volume ls` still lists the old ones if something in
# there was worth keeping. Written up in docs/DEV-SETUP.md §2.
name: calevate-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: calevate
      POSTGRES_PASSWORD: calevate
      POSTGRES_DB: calevate
    # Host port 5433: 5432 is occupied by another project on this machine.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calevate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host port 6380: 6379 is occupied by another project on this machine.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for R2 / DO Spaces. Recordings are the system of record, so
  # local work still goes through an S3 API rather than the filesystem.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: calevate
      MINIO_ROOT_PASSWORD: calevate123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
