packages:
  - "apps/web"

# Rolldown is Vite's bundler; its platform-specific binaries are legitimate but
# were published recently enough to trip the 24-hour quarantine window. Exclude
# them specifically rather than disabling the policy for all packages.
minimumReleaseAgeExclude:
  - "rolldown"
  - "@rolldown/*"

overrides:
  eslint-import-resolver-typescript: "3.7.0"
  unrs-resolver: "npm:oxc-resolver@1.1.2"
  "brace-expansion@<1.1.18": ">=1.1.18"
  "brace-expansion@>=4 <5.0.9": ">=5.0.9"
  postcss: ">=8.5.23"
  nanoid: ">=3.3.17"
  sharp: ">=0.35.0"

# Build scripts are opt-in in pnpm 11. sharp = Next.js image optimization
# (first-party toolchain dep). unrs-resolver was REMOVED here after the Jul 2026
# supply-chain incident (see incident_report.md + CLAUDE.md hard rule 9): it is
# pinned out of the tree via `resolutions` above, and no unknown package gets
# build permission again without verifying legitimacy first.
allowBuilds:
  sharp: true

# This must stay the ONLY pnpm-workspace.yaml in the repo. create-next-app drops
# a nested one in apps/web with `ignoredBuiltDependencies` — it makes apps/web a
# second workspace root and breaks `pnpm -C apps/web <script>`. Delete it if it
# reappears after a scaffold/upgrade.
