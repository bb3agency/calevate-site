[project]
name = "calevate"
version = "0.1.0"
description = "Calevate — multi-tenant AI voice-agent SaaS for Indian SMBs (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

# Virtual root: the repo root is not itself an installable package, it only
# owns the workspace, the lockfile and the shared tool config.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/voice-runtime", "apps/workers", "packages/shared"]

[tool.uv.sources]
calevate-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "pre-commit>=4.0",
    "import-linter>=2.1",
    # The coverage ratchet's measurement (D-29 `coverage:ratchet`). `coverage` itself,
    # not `pytest-cov`: the plugin is a wrapper around `coverage run -m pytest`, which is
    # one Makefile line, and this way the gate adds exactly ONE package with no runtime
    # dependencies of its own on 3.12 rather than a package plus its own flag surface.
    "coverage>=7.10",
]

# ERROR REPORTING, and it is a GROUP rather than a runtime dependency (P5.10).
#
# `core/observability.py` has always initialised Sentry properly — scrubbed
# `before_send`, `send_default_pii=False`, no second tracing pipeline — inside a
# `try: import sentry_sdk / except ImportError: log.warning(...)`. What it never had was
# anything that installs the package, so `sentry_dsn_set_but_sdk_missing` was not a
# tolerant fallback, it was the ONLY reachable outcome. A capability that cannot be
# turned on is not optional, it is absent, and three documents counted on it.
#
# NOT in `apps/api`/`apps/workers` `dependencies`, because `uv sync` installs ONE venv
# for the whole workspace and voice-runtime shares it. `init_observability` imports the
# SDK only when a DSN is set, so an installed-but-unused package costs that process
# nothing at import time — but hard rule 3 makes voice-runtime's boot graph a thing to
# keep deliberately small, and a group is how a deployment opts in per host rather than
# by editing a runtime dependency list.
#
# `uv sync --all-packages --group errors` on the api/worker host — `--all-packages` is
# not optional, because a bare `uv sync --group errors` drops every workspace member in a
# uv workspace (measured, not assumed). DEPLOYMENT §8 carries it. The
# lockfile diff was read before adding: `sentry-sdk` brings `urllib3` and `certifi`, both
# already in this tree, and declares no build hooks (hard rule 9).
errors = [
    "sentry-sdk>=2.20",
]

# --- import-linter (guardrail: engine isolation, hard rule 2) -----------------
# Contracts grow with the code; this seed contract locks the boundary that exists
# today: shared contracts never depend on app code.
[tool.importlinter]
root_packages = ["calevate_shared", "apps"]

[[tool.importlinter.contracts]]
name = "shared package imports no app code"
type = "forbidden"
source_modules = ["calevate_shared"]
forbidden_modules = ["apps"]

# Hard rule 2 (engine isolation). The rule is about VENDOR PAYLOAD SHAPES, not about
# the word "engine": business modules and workers legitimately need an engine — the
# post-call pipeline and the reconciliation poller cannot exist without one (TRD §8) —
# they just must reach it through `apps.api.engine`'s factory, which hands back the
# VoiceEngine Protocol and normalized models. What is forbidden is importing a VENDOR
# ADAPTER module, because that is the only way a vendor shape can leak upward.
# Extend `source_modules` whenever a new business module is added; the voice-runtime
# twin is its own tiny module (apps/voice-runtime/engine_intake.py) and never imports
# an adapter either.
[[tool.importlinter.contracts]]
name = "engine isolation: only engine/ may see vendor payload shapes"
type = "forbidden"
source_modules = [
    "apps.api.admin",
    "apps.api.agents",
    "apps.api.authn",
    "apps.api.billing",
    "apps.api.campaigns",
    "apps.api.compliance",
    "apps.api.copilot",
    "apps.api.crm",
    "apps.api.db",
    "apps.api.ingest",
    "apps.api.integrations",
    "apps.api.kb",
    "apps.api.legal",
    "apps.api.ops",
    "apps.api.reliability",
    "apps.api.retrieval",
    "apps.api.tenancy",
    "apps.api.core",
    "apps.workers",
]
forbidden_modules = [
    "apps.api.engine.bolna",
    "apps.api.engine.cartesia",
    "apps.api.engine.fake",
]
# DIRECT imports only. The factory in `apps.api.engine` obviously imports the adapters —
# that is what a factory does — and forbidding the transitive chain would forbid having
# a factory at all. What leaks a vendor shape into a module is that module NAMING the
# vendor module in its own imports, and that is exactly what stays banned.
allow_indirect_imports = true

# --- Ruff (CI gate) -----------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages"]
# Autogenerated migration bodies are exempt from style lint (the hand-written
# governance blocks in them are still covered by review + the RLS guardrail).
#
# `bolna-findings/` IS THE VENDOR EVIDENCE MIRROR AND MUST NEVER BE REWRITTEN. It is not
# our source: it is a fetched, hash-pinned snapshot of the vendor's documentation, and
# `bolna-findings/mirror/MANIFEST.json` carries a `sha256` for each of its 335 pages so
# that a citation can be pinned to a byte-exact artefact. **ruff formats Python code
# blocks inside Markdown**, so `uv run ruff format .` — the exact command CLAUDE.md's
# Commands section tells everyone to run — silently reformatted the vendor's own code
# samples and broke 15 of those hashes before anyone noticed. Eight were recoverable from
# git; SEVEN are mismatched at HEAD, i.e. they were committed that way and no revert
# reaches them. Nothing in the tree checked the manifest, so the damage was invisible and
# every audit citing the mirror was resting on it — `tests/vendor_evidence_guard_test.py`
# is the check that now exists, and it carries those seven as a shrinking ledger.
#
# Excluded rather than "just don't run format from the repo root": a rule that depends on
# every future contributor remembering a caveat is not a rule. Style lint on a vendor's
# documentation was never wanted anyway — the code in there is THEIRS, and its value is
# that it is verbatim.
#
# `docs/evidence` IS ON THIS LIST FOR EXACTLY THE SAME REASON, AND IT WAS ADDED AFTER THE
# SAME DEFECT HAPPENED A SECOND TIME. `ruff format .` rewrote a fenced Python block inside
# `docs/evidence/llm-multi-provider-2026-08.md` — restyling `MINIMAL = 'MINIMAL'` to double
# quotes and re-indenting a class body — and that block is a VERBATIM QUOTE of
# `googleapis/python-genai@66807187f212 google/genai/types.py:364-376`, cited by line as
# proof that Google's `ThinkingLevel` enum has no zero. An evidence page whose quoted bytes
# have been restyled is no longer evidence: the next reader diffing it against the vendor's
# real file finds differences our formatter introduced, and cannot tell those from the
# vendor having changed. `docs/evidence/` holds no Python of its own (checked — zero `.py`
# files), so nothing is lost by excluding it and the verbatim quotes stay verbatim.
extend-exclude = ["alembic/versions", "bolna-findings", "docs/evidence"]
# `extend-exclude` alone is NOT enough, and the difference is the whole defect. Ruff
# honours exclusions during directory traversal but IGNORES them for paths handed to it
# explicitly on the command line — and `.pre-commit-config.yaml` runs `ruff-format` as a
# pre-commit hook, which is a tool whose entire calling convention is "here is the exact
# list of files that changed". So a commit touching an evidence page would reformat it
# again, past an exclusion that reads correctly and does nothing. `force-exclude` is the
# setting that makes the exclusion mean what it says in both invocations.
force-exclude = true

[tool.ruff.lint]
# `W` was added after a defect it would have caught escaped every gate this repo has.
# A docstring quoted a regex in a NON-RAW string, so `\.` became `SyntaxWarning: invalid
# escape sequence` on every import of a worker module — noise on a real operator's
# console, from a file whose whole subject is being read by an operator. ruff was silent
# because W605 lives in `W` and `W` was not selected; mypy does not look at string
# contents; the tests passed because a warning is not an error. It was caught by a human
# noticing the warning scroll past, which is the least reliable instrument here.
#
# IT COST NOTHING TO TURN ON — `ruff check --select W --statistics .` reported ZERO
# violations across the tree at the moment it was added, so this bought a whole class of
# future defect for no cleanup. That is also the argument for doing it NOW rather than
# "when we have time": the price of enabling a ruleset only ever goes up.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "W"]

[tool.ruff.lint.per-file-ignores]
# `from sqlalchemy.dialects.postgresql import UUID as PgUUID` is the idiomatic alias.
"apps/api/**/models.py" = ["N811"]
"apps/api/db/base.py" = ["N811"]
# B008 forbids function calls in argument defaults; `Depends(...)`/`Query(...)` in a
# default IS the FastAPI dependency-injection API, and BACKEND-PATTERNS §1 mandates
# it ("services receive deps via FastAPI Depends()"). Scoped to the files that wire
# routes, so the rule still catches accidental calls everywhere else.
"apps/api/**/routes.py" = ["B008"]
"apps/api/core/deps.py" = ["B008"]
"apps/api/core/auth.py" = ["B008"]

# --- mypy (strict; CI gate) ---------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/shared/src"

[tool.pydantic-mypy]
init_typed = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Third-party packages that ship no type information. Listed explicitly so the set
# stays small and visible; anything added here is a library we have chosen to use
# untyped, not a silence for our own code.
[[tool.mypy.overrides]]
module = [
    "boto3.*",       # AWS SDK — types live in the separate boto3-stubs package
    "botocore.*",
    "sentry_sdk.*",  # optional dependency, imported inside a try/except ImportError
    # opentelemetry-api ships py.typed; the SDK and the OTLP exporter do not. Both are
    # imported inside `init_tracing`'s try/except ImportError, and everything they hand
    # back is held as `Any` behind this repo's own `span()`/`traced_job()` API.
    "opentelemetry.sdk.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# ONE event loop for the whole session, mirroring production. The Redis client and the
# SQLAlchemy async pool are process-level singletons bound to the loop that created
# them, so a loop-per-test would hand the second test a pool whose loop is closed.
asyncio_default_test_loop_scope = "session"
# An xfail that starts passing is a FAILURE, not a quiet win. This repo uses xfail to
# PIN A KNOWN DEFECT to the file that owns it — "publish is un-callable", "the published
# KB diverges from what was approved". Without this, fixing one of those turns the test
# into a silent XPASS: the suite stays green, the pin stops meaning anything, and the
# comment naming the gap outlives the gap. Strict makes the fixer notice and either
# promote the test or delete it.
xfail_strict = true
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests", "apps", "packages"]
# apps/* are virtual workspace members imported by path (apps.api.main), so the
# repo root must be importable. `apps/voice-runtime` is hyphenated (D-18) and so is
# NOT importable as a module path — it runs with `--app-dir`, and tests get the same
# treatment by putting the directory itself on the path.
pythonpath = [".", "apps/voice-runtime"]
markers = [
    "smoke: end-to-end smoke test (tenant -> agent -> webhook -> lead)",
    "rls: cross-tenant isolation tests; must return zero rows",
    "conformance: VoiceEngine adapter conformance suite",
]

# --- coverage.py (input to the coverage ratchet, D-29) ------------------------
# Deliberately tiny. Every knob here can make the ratcheted number easier, so the only
# ones set are the ones that make it MEAN something:
#
#   branch  — the rules this repo guards are rules about the branch NOT taken (the
#             tenant that does not match, the consent that is absent, the ack that
#             arrives twice). Line coverage is satisfied by executing an `if` once.
#   source  — the two Python trees, named rather than inferred, so a module NO test
#             imports is still reported (at 0%) instead of vanishing from the report and
#             taking its uncovered lines with it.
#   omit    — test files only. Measuring the tests' own coverage measures nothing.
#
# There is no `fail_under`: a percentage threshold is the "target" D-29 rules out. The
# gate is scripts/check_coverage_ratchet.py, which counts uncovered units per hard-rule
# surface. See its docstring for why, and for why `# pragma: no cover` inside a guarded
# surface buys nothing there.
[tool.coverage.run]
branch = true
source = ["apps", "packages"]
# CI and a laptop check out to different absolute paths; the baseline is one file for
# both, so the report has to key on repo-relative names.
relative_files = true
omit = ["*_test.py", "*/tests/*"]
# WITHOUT THIS, EVERY ASYNC FUNCTION LOOKED UNCOVERED FROM ITS FIRST DATABASE CALL ON.
#
# SQLAlchemy's asyncio layer is a greenlet bridge: `session.execute` hands off to a
# greenlet that runs the sync DBAPI and switches back (`greenlet_spawn`,
# sqlalchemy/util/concurrency.py). Coverage's tracer is per-execution-context, so it is
# lost across that switch and never reinstated — the code runs, the test passes, and the
# lines after the await are recorded as never executed.
#
# Measured on ONE route test that returns real rows: `crm/service.dashboard` recorded 14
# lines without this setting and 18 with it, and the four it gained are the ones after
# its second `await`. `thread` alone reproduces the 14 exactly, so `greenlet` is the mode
# that matters; `thread` is kept because several suites drive real ARQ workers and an
# explicit list is cheaper to read than a default nobody can see.
#
# This is why it was found: an agent covering new refusal branches noticed its passing
# ROUTE-level tests were reported as not executing the handler, and reached for
# service-level tests instead. The tests were fine. The measurement was wrong, and it had
# been wrong for every number this repo has ever ratcheted.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
